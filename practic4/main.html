<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>postcard</title>
    <link rel="stylesheet" href="stule.css">

</head>
<body>
    <h1>POST CARD</h1>
    <p class="subtitle">Заполните форму — увидите открытку справа</p>

    <div class="main-grid">

        <div class="container">
            <form id="postcardForm">
                <label>От кого<input type="text" id="from" maxlength="50" placeholder="Иван Иванов"></label>
                <label>Кому<input type="text" id="to" maxlength="50" placeholder="Мария Петрова"></label>
                <label>Тема открытки
                    <select id="theme-select">
                        <option value="min">Минимализм</option>
                        <option value="minecraft">Майнкрафт</option>
                        <option value="sea">Море</option>
                        <option value="pink">Розовая</option>
                        <option value="dark">Тёмная</option>
                    </select>
                </label>
                <label>Текст открытки<textarea id="message" maxlength="200" placeholder="Дорогой друг, поздравляю..."></textarea></label>
                <button type="submit" id="sendBtn" disabled>Отправить открытку</button>
            </form>
        </div>

        <div class="preview-col">
            <div class="preview-title">Предпросмотр</div>
            <div class="postcard theme-min" id="previewCard">
                <div id="previewDeco"></div>
                <div class="pc-stamps" id="previewStamps">
                    <div class="pc-stamp"><img src="" alt="stamp"></div>
                </div>
                <div class="pc-title">Post<br>Card</div>
                <div class="pc-fields">
                    <div class="pc-field">
                        <span class="lbl">From:</span>
                        <span class="val" id="previewFrom">—</span>
                    </div>
                    <div class="pc-field">
                        <span class="lbl">To:</span>
                        <span class="val" id="previewTo">—</span>
                    </div>
                </div>
                <div class="pc-message">
                    <div class="pc-message-text placeholder" id="previewMessage">Здесь появится ваш текст...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="history-section">
        <h2>История открыток</h2>
        <div id="historyContainer" class="history-grid">
            <p class="empty-msg">Здесь появятся ваши открытки...</p>
        </div>
    </div>
    <script src="./js.js"></script>
</body>
</html>
